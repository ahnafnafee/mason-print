name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests & debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          # NOTE: `cache:` intentionally omitted. Its bundled save runs in a post-step even when an
          # earlier step failed, which can poison the cache for later runs. The cache is restored
          # and saved explicitly below, with the save gated on success().

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        # No `packages:` pin. The build targets a platform whose package id moves with each SDK
        # minor (android-36.1, android-37.0), and a stale pin fails the run before Gradle starts.
        # Licenses are accepted here, so AGP downloads exactly the platform and build-tools that
        # app/build.gradle.kts asks for.

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests + lint + debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Save only on a fully green run so a half-built tree can never poison the cache.
      - name: Save Gradle cache
        if: success() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

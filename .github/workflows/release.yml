name: Release

# Manual release pipeline. Dispatch with a semver VERSION; it validates the version, builds a
# SIGNED release APK, and publishes a GitHub release tagged v<version>. Dispatch from the branch
# you want to release (normally `main`).
#
# There is no Google Play step and no .aab: this app is distributed as a sideloadable APK from the
# GitHub releases page, and nowhere else.
#
# The version input is the single source of truth:
#   - rejected if not MAJOR.MINOR.PATCH
#   - rejected if tag v<version> already exists (already released)
#   - rejected if not strictly higher than the latest v* tag
# versionCode is derived from it (MAJOR*10000 + MINOR*100 + PATCH) so it always increases with the
# version. Android refuses to install an APK whose versionCode is lower than the installed one, so
# a scheme that cannot go backwards is what keeps upgrades working for sideloaders.
#
# Requires these repository secrets (Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64  - base64 of the release keystore (.jks)
#   RELEASE_STORE_PASSWORD   - keystore store password
#   RELEASE_KEY_ALIAS        - key alias
#   RELEASE_KEY_PASSWORD     - key password
#
# All four are mandatory. A sideloaded app can only be upgraded in place by an APK signed with the
# same key, so an unsigned or differently-signed release would strand every existing install.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, semver MAJOR.MINOR.PATCH (e.g. 1.4.1). Must be higher than the latest release.'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: false
        type: boolean
        default: false
      notes:
        description: 'Optional custom release notes. Leave blank to generate summaries from commits since the previous release.'
        required: false
        type: string
        default: ''

permissions:
  contents: write # create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history + tags for version validation and release notes

      - name: Validate version & derive versionCode
        id: ver
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ver="$VERSION"
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$ver' must be MAJOR.MINOR.PATCH (e.g. 1.4.1)." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "::error::Tag v$ver already exists, so version $ver is already released." >&2
            exit 1
          fi
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')"
          if [ -n "$latest" ]; then
            top="$(printf '%s\n%s\n' "$latest" "$ver" | sort -V | tail -n1)"
            if [ "$ver" = "$latest" ] || [ "$top" != "$ver" ]; then
              echo "::error::Version $ver is not higher than the latest release (v$latest)." >&2
              exit 1
            fi
          fi
          major="${ver%%.*}"; rest="${ver#*.}"; minor="${rest%%.*}"; patch="${rest##*.}"
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::minor and patch must each be < 100 for the versionCode scheme." >&2
            exit 1
          fi
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          {
            echo "version_name=$ver"
            echo "version_code=$code"
            echo "tag=v$ver"
            echo "previous_tag=${latest:+v$latest}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$ver (versionCode $code). Previous latest: v${latest:-none}"

      - name: Generate release notes
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
          PREVIOUS_TAG: ${{ steps.ver.outputs.previous_tag }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          python3 scripts/generate_release_notes.py \
            --previous-tag "$PREVIOUS_TAG" \
            --tag "$RELEASE_TAG" \
            --repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --output build/release-notes.md

      # Fail before the minutes-long build when the release credentials are incomplete.
      - name: Preflight signing prerequisites
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing one or more signing secrets (RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD)." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          # NOTE: `cache:` intentionally omitted. See the same note in ci.yml.

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        # No `packages:` pin; see the same note in ci.yml.

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode signing keystore & write keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build signed release APK
        run: >
          ./gradlew :app:assembleRelease
          -PversionName=${{ steps.ver.outputs.version_name }}
          -PversionCode=${{ steps.ver.outputs.version_code }}
          --stacktrace --no-daemon

      - name: Stage artifact
        id: artifacts
        run: |
          set -euo pipefail
          apk="MasonPrint-${{ steps.ver.outputs.version_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "Staged $apk ($(du -h "$apk" | cut -f1))"

      # The build falls back to the debug key when keystore.properties is missing. Asserting the
      # certificate here is what makes a silently-debug-signed release impossible: such an APK
      # installs fine on a clean device and only fails months later, as a refused upgrade.
      - name: Verify APK signature
        run: |
          set -euo pipefail
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          certs=$("$build_tools/apksigner" verify --print-certs "${{ steps.artifacts.outputs.apk }}")
          echo "$certs"
          if printf '%s' "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::This APK is signed with the Android debug key, which means keystore.properties was not picked up." >&2
            exit 1
          fi

      # Catches a packaging regression the moment a dependency starts shipping native libraries.
      - name: Verify 16 KB APK alignment
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/zipalign" -c -P 16 -v 4 "${{ steps.artifacts.outputs.apk }}"

      # Save only on a fully green run so a half-built tree can never poison the cache.
      - name: Save Gradle cache
        if: success() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Mason Print v${{ steps.ver.outputs.version_name }}
          body_path: build/release-notes.md
          prerelease: ${{ inputs.prerelease }}
          files: ${{ steps.artifacts.outputs.apk }}
          fail_on_unmatched_files: true
